name: Relatar bug
description: Registre um comportamento incorreto ou uma regressão.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Explique o problema e o comportamento esperado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
      placeholder: "1. Abra...\n2. Execute...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: unity
    attributes:
      label: Versão do Unity
      placeholder: 6000.4.0f1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Plataforma e sistema operacional
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs e evidências
      description: Arraste logs, capturas ou vídeos. Remova dados sensíveis.

